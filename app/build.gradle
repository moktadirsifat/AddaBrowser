plugins {
    id 'com.android.application'
}

android {
    namespace 'com.adda.browser'
    compileSdk 30

    defaultConfig {
        applicationId 'com.adda.browser'
        minSdk 23
        targetSdk 28
        versionCode 4
        versionName '1.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            // Temporary test signing: use Gradle's debug key so this release
            // candidate is installable without publishing a private key.
            // A persistent private release key is required for future updates.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
