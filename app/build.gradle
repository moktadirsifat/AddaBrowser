plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_FILE')
def configuredVersionCode = providers.gradleProperty('appVersionCode').getOrElse('165').toInteger()
def configuredVersionName = providers.gradleProperty('appVersionName').getOrElse('1.16.5')

android {
    namespace 'com.adda.browser'
    compileSdk 36
    testBuildType 'release'

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        // New application ID lets SIFAT Browser install beside the legacy Adda Browser.
        applicationId 'com.sifat.browser'
        minSdk 23
        targetSdk 36
        versionCode configuredVersionCode
        versionName configuredVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
