plugins {
    id 'com.android.application'
}

android {
    namespace 'com.adda.browser'
    compileSdk 30

    defaultConfig {
        applicationId 'com.adda.browser'
        minSdk 23
        targetSdk 28
        versionCode 3
        versionName '1.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_8
        targetCompatibility JavaVersion.VERSION_8
    }
}
