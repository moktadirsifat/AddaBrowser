plugins {
    id 'com.android.application'
}

android {
    namespace 'com.adda.browser'
    compileSdk 36

    defaultConfig {
        // New application ID lets SIFAT Browser install beside the legacy Adda Browser.
        applicationId 'com.sifat.browser'
        minSdk 23
        targetSdk 36
        versionCode 10
        versionName '1.9'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // Temporary test signing only; configure a persistent private release key before public distribution.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
