plugins {
    id 'com.android.application'
}

android {
    namespace 'com.adda.browser'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        // New application ID lets SIFAT Browser install beside the legacy Adda Browser.
        applicationId 'com.sifat.browser'
        minSdk 23
        targetSdk 36
        versionCode 16
        versionName '1.16'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // Temporary test signing only; configure a persistent private release key before public distribution.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'

    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
