plugins {
    id 'com.android.application'
}

android {
    namespace 'com.adda.browser'
    compileSdk 36

    defaultConfig {
        applicationId 'com.adda.browser'
        minSdk 23
        targetSdk 36
        versionCode 5
        versionName '1.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // Temporary test signing only; a private persistent release key is still needed.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
