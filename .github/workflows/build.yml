name: Build SIFAT Browser APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "v1.16.5" ]
    # Skip APK builds for documentation-only commits.
    # Any source, resource, or build-configuration change still triggers CI.
    paths-ignore:
      - '**.md'
      - 'docs/**'

# If a newer commit arrives on main, stop the older run and build the latest code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare persistent release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sifat-release.jks"
          test -s "$RUNNER_TEMP/sifat-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/sifat-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/sifat-release.jks" >> "$GITHUB_ENV"
      - name: Build debug and release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --build-cache testDebugUnitTest assembleDebug assembleRelease
      - name: Build signed updater E2E candidate and test APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          base_apk="$RUNNER_TEMP/sifat-browser-v1.16.5.apk"
          cp app/build/outputs/apk/release/app-release.apk "$base_apk"
          mkdir -p app/src/androidTest/assets
          rm -f app/src/androidTest/assets/candidate-update.apk
          gradle --no-daemon --build-cache -PappVersionCode=166 -PappVersionName=1.16.6 assembleRelease
          cp app/build/outputs/apk/release/app-release.apk app/src/androidTest/assets/candidate-update.apk
          test -s app/src/androidTest/assets/candidate-update.apk
          gradle --no-daemon --build-cache assembleReleaseAndroidTest
          test -s app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          cp "$base_apk" app/build/outputs/apk/release/app-release.apk
      - name: Prepare emulator diagnostics
        if: always()
        run: |
          : > android11-emulator-logcat.txt
      - name: Verify updater end-to-end flow on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          # Start from a clean AVD; avoid restoring a corrupted/stale snapshot.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          disable-animations: true
          script: bash scripts/android11_ci_test.sh
      - name: Upload Android 11 emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-11-emulator-diagnostics
          path: android11-emulator-logcat.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SIFAT-Browser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SIFAT-Browser-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
