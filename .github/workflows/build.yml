name: Build Adda Browser APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug and release APKs
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AddaBrowser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: AddaBrowser-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
