name: Build SIFAT Browser APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "v1.16.5" ]
    # Skip APK builds for documentation-only commits.
    # Any source, resource, or build-configuration change still triggers CI.
    paths-ignore:
      - '**.md'
      - 'docs/**'

# If a newer commit arrives on main, stop the older run and build the latest code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug and release APKs
        run: gradle --no-daemon --build-cache assembleDebug assembleRelease
      - name: Prepare emulator diagnostics
        if: always()
        run: |
          : > android11-emulator-logcat.txt
      - name: Verify release APK installs and launches on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          # Start from a clean AVD; avoid restoring a corrupted/stale snapshot.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          disable-animations: true
          script: |
            set -Eeuo pipefail

            diagnostics() {
              echo "===== ADB devices ====="
              adb devices -l || true
              echo "===== Android boot properties ====="
              adb shell getprop sys.boot_completed || true
              adb shell getprop init.svc.bootanim || true
              echo "===== Package Manager binder ====="
              adb shell service check package || true
              echo "===== Recent Android logcat ====="
              adb logcat -d -b all -t 5000 > android11-emulator-logcat.txt 2>&1 || true
            }
            trap 'result=$?; diagnostics; exit "$result"' ERR

            wait_for_android_services() {
              local timeout_seconds="${1:-180}"
              local deadline=$((SECONDS + timeout_seconds))
              while (( SECONDS < deadline )); do
                if adb get-state >/dev/null 2>&1 &&
                   [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] &&
                   adb shell service check package 2>/dev/null | grep -q "found" &&
                   adb shell cmd package list packages >/dev/null 2>&1; then
                  echo "Android boot and Package Manager are ready."
                  return 0
                fi
                echo "Waiting for Android/Package Manager readiness..."
                adb reconnect device >/dev/null 2>&1 || true
                sleep 5
              done
              echo "Android Package Manager did not become ready in ${timeout_seconds}s."
              return 1
            }

            adb wait-for-device
            wait_for_android_services 240

            apk="app/build/outputs/apk/release/app-release.apk"
            installed=false
            for attempt in 1 2 3; do
              echo "APK installation attempt ${attempt}/3 (non-streaming)"
              if adb install --no-streaming -r "$apk"; then
                installed=true
                break
              fi
              echo "Install attempt ${attempt} failed; checking Android services before retry."
              adb reconnect device >/dev/null 2>&1 || true
              adb wait-for-device
              wait_for_android_services 120
            done
            if [ "$installed" != "true" ]; then
              echo "APK installation failed after 3 attempts."
              false
            fi

            adb shell am start -n com.sifat.browser/com.adda.browser.MainActivity
            app_started=false
            for attempt in $(seq 1 45); do
              if adb shell pidof com.sifat.browser 2>/dev/null | grep -q '[0-9]'; then
                app_started=true
                break
              fi
              sleep 2
            done
            if [ "$app_started" != "true" ]; then
              echo "SIFAT Browser process did not start."
              false
            fi
            sleep 10
            python scripts/android11_smoke.py
      - name: Upload Android 11 emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-11-emulator-diagnostics
          path: android11-emulator-logcat.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SIFAT-Browser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SIFAT-Browser-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
