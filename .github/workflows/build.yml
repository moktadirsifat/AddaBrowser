name: Build SIFAT Browser APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "v1.16.5" ]
    # Skip APK builds for documentation-only commits.
    # Any source, resource, or build-configuration change still triggers CI.
    paths-ignore:
      - '**.md'
      - 'docs/**'

# If a newer commit arrives on main, stop the older run and build the latest code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug and release APKs
        run: gradle --no-daemon --build-cache assembleDebug assembleRelease
      - name: Verify release APK installs and launches on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.sifat.browser/com.adda.browser.MainActivity
            adb shell pidof com.sifat.browser
            python scripts/android11_smoke.py
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SIFAT-Browser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SIFAT-Browser-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
