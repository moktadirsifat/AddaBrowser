name: Build SIFAT Browser APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug and release APKs
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Verify release APK installs and launches on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device
            for attempt in $(seq 1 60); do
              booted="$(adb shell getprop sys.boot_completed | tr -d '\r')"
              [ "$booted" = "1" ] && break
              sleep 2
            done
            if [ "$booted" != "1" ]; then
              echo "Android 11 emulator did not finish booting"
              exit 1
            fi

            installed=0
            for attempt in 1 2 3; do
              if adb install -r app/build/outputs/apk/release/app-release.apk; then
                installed=1
                break
              fi
              echo "APK install attempt $attempt failed; restarting ADB before retry"
              adb kill-server || true
              adb start-server
              adb wait-for-device
              sleep 5
            done
            if [ "$installed" != "1" ]; then
              echo "Release APK could not be installed after 3 attempts"
              exit 1
            fi

            adb shell am start -W -n com.sifat.browser/com.adda.browser.MainActivity
            sleep 5
            adb shell pidof com.sifat.browser
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SIFAT-Browser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SIFAT-Browser-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
